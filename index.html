function openTk(id, tab='overview'){
  const t=DB.tickets[id]; if(!t) return; if(!canSeeTicket(t) && !canSeeReq(DB.requests[t.req])) return toast('Your role cannot open this ticket.',true);
  closeModal(); S.drawer=['tk',id,tab];
  const acts=availTActions(t); const r=DB.requests[t.req]; const tgt=(DB.sla.repairTarget||{})[t.level]||72;
  const kv=(k,v)=>`<div><span>${esc(k)}</span><b>${v===''||v==null?'<span class="muted">Not given</span>':v}</b></div>`;
  const au=DB.audit.filter(a=>a.ref===id);
  const tabs=[['overview','Overview'],['comps','Components',t.comps.length],['work','Work sessions',t.sessions.length],['hist','History',t.history.length],['audit','Audit trail',au.length]];
  let body='';
  if(tab==='overview') body=`<div class="panel"><div class="kv">${kv('Repair ticket no',esc(t.id))}${kv('Spare part number',esc(t.pn))}${kv('Spare description',esc(t.desc))}${kv('Serial number',esc(t.serial))}
    ${kv('Branch',esc(t.branch))}${kv('Repair location',esc(t.loc)+' ('+t.level+')')}${kv('Assigned engineer',esc(uname(t.engineer)))}${kv('Received date',fdt(t.received))}
    ${kv('Work hours',fh(workHrs(t)))}${kv('Turnaround',`<span class="${tat(t)>tgt?'bad-t':''}">${fh(tat(t))}</span> <span class="muted small">target ${fh(tgt)}</span>`)}${kv('Component cost',inr(compCost(t)))}${kv('Spare request',reqLink(t.req))}</div>
    <div style="margin-top:14px"><span class="muted small">Defect description</span><p>${esc(t.defect)}</p>${t.outcomeNote?`<span class="muted small">Outcome</span><p>${esc(t.outcome)}: ${esc(t.outcomeNote)}</p>`:''}</div></div>`;
  else if(tab==='comps') body=`<div class="tw"><table><thead><tr><th>Component</th><th>Code</th><th class="r">Qty</th><th class="r">Unit cost</th><th class="r">Total</th><th>Source inventory</th><th>Added</th></tr></thead><tbody>${t.comps.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.code)}</td><td class="r">${c.qty}</td><td class="r">${inr(c.cost)}</td><td class="r">${inr(c.qty*c.cost)}</td><td>${esc(c.source)}</td><td class="nw">${fdt(c.ts)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No components used yet.</td></tr>'}</tbody><tfoot><tr><td colspan="4">Total component cost</td><td class="r">${inr(compCost(t))}</td><td colspan="2"></td></tr></tfoot></table></div>`;
  else if(tab==='work') body=`<div class="tw"><table><thead><tr><th>#</th><th>Started</th><th>Ended</th><th class="r">Duration</th></tr></thead><tbody>${t.sessions.map((s,i)=>`<tr><td>${i+1}</td><td>${fdt(s.s)}</td><td>${s.e?fdt(s.e):'<b>Running</b>'}</td><td class="r">${fh(hrs(s.s,s.e||nowISO()))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Not started.</td></tr>'}</tbody></table></div>`;
  else if(tab==='hist') body=`<div class="panel"><ol class="tl">${t.history.map(h=>`<li style="--tc:var(--c-repair)"><div class="h"><b>${esc(h.action)}</b></div><div class="w">${fdt(h.ts)}, ${esc(uname(h.by))}</div>${h.note?`<div class="d">${esc(h.note)}</div>`:''}</li>`).join('')}</ol></div>`;
  else body=auditList(au);
  openDrawer(`<div class="dr-h"><div class="row"><div><h2>${esc(t.id)}</h2><div class="dr-meta">${tpill(t.status)}<span class="tag">${t.level} TRCE</span><span class="muted small">${esc(t.desc)}, serial ${esc(t.serial)}</span></div></div>

    <div class="dr-b"><div class="stack">${acts.length?`<div class="actionbar"><div class="who"><b>Repair actions</b>${esc(uname(t.engineer))}</div>${acts.map(a=>`<button class="btn sm ${a.danger?'danger':a.pri?'pri':''}" data-act="tact" data-k="${a.k}" data-id="${esc(id)}">${esc(a.label)}</button>`).join('')}</div>`:''}${body}</div></div>`);

/* ---------------- search everywhere ---------------- */
function openSearch(){
  openModal(`<div class="modal-h"><div style="flex:1"><input type="search" id="gsq" placeholder="Request ID, call ID, customer, docket, serial, part, ticket" aria-label="Search everywhere"></div><button class="btn sm" data-act="closeModal">Close</button></div><div class="modal-b"><div id="gsr" class="gsr"><p class="muted">Type at least two characters. Results respect your role.</p></div></div>`);
  const q=$('#gsq'); q.focus(); q.oninput=debounce(()=>{ $('#gsr').innerHTML=searchResults(q.value); },120);
  q.onkeydown=e=>{ if(e.key==='Enter'){ const b=$('#gsr button'); if(b) b.click(); } };
}
function searchResults(q){
  q=q.trim().toLowerCase(); if(q.length<2) return '<p class="muted">Type at least two characters.</p>';
  const out=[]; const hit=s=>String(s).toLowerCase().includes(q);
  reqs().forEach(r=>{ if([r.id,r.callId,r.customer,r.serial,r.faultySerial,r.pn,partName(r.pn),r.branch,uname(r.engineer)].some(hit)) out.push(['Request',r.id,`${r.customer}, ${partName(r.pn)}, ${r.status}`,'req',r.id]); });
  tickets().forEach(t=>{ if([t.id,t.serial,t.pn,t.desc,uname(t.engineer)].some(hit)) out.push(['Repair job',t.id,`${t.desc}, ${t.status}, ${uname(t.engineer)}`,'tk',t.id]); });
  Object.values(DB.shipments).forEach(s=>{ const r=DB.requests[s.ref]; if(r&&canSeeReq(r)&&[s.id,s.docket,s.courier].some(hit)) out.push(['Shipment',s.docket,`${s.courier}, ${s.leg}, ${shipState(s)}`,'req',s.ref]); });
  creqs().forEach(c=>{ if([c.id,c.code,c.name,c.loc].some(hit)) out.push(['Component req.',c.id,`${c.name} x${c.qty}, ${c.loc}, ${c.status}`,'cr',c.id]); });
  Object.values(DB.transfers).filter(x=>canSeeXfer(x)).forEach(x=>{ if([x.id,x.pn,x.from,x.to].some(hit)) out.push(['Transfer',x.id,`${x.pn} x${x.qty}, ${x.from} to ${x.to}`,'xf',x.id]); });
  DB.txns.forEach(x=>{ if(x.id.toLowerCase()===q || (x.batch&&x.batch.toLowerCase()===q)) out.push(['Transaction',x.id,`${x.type}, ${x.loc}, ${x.pn} ${x.qty}`,DB.requests[x.ref]?'req':DB.tickets[x.ref]?'tk':'none',x.ref]); });
  if(can('inv.view')) Object.values(DB.parts).forEach(p=>{ if([p.pn,p.desc,p.cat].some(hit)) out.push(['Spare part',p.pn,p.desc,'part',p.pn]); });
  if(can('admin.users')) Object.values(DB.users).forEach(u=>{ if([u.id,u.name,u.loc].some(hit)) out.push(['User',u.name,`${u.id}, ${u.role}, ${u.loc}`,'user',u.id]); });
  if(!out.length) return '<p class="muted">Nothing found. Try a request ID such as SR-, a docket number, or a part code such as SP-PCB.</p>';
  return out.slice(0,40).map(o=>`<button data-act="open" data-kind="${o[3]}" data-id="${esc(o[4])}"><span class="k">${esc(o[0])}</span><span><b>${esc(o[1])}</b><br><span class="muted small">${esc(o[2])}</span></span></button>`).join('')+(out.length>40?`<p class="muted small">${out.length-40} more. Refine the search.</p>`:'');
}

function nrSide(){

  else if(!b||!p){ h+='<p class="muted">Pick the branch and spare to see stock and the likely route.</p>'; }
  else { const h0=hubOf(b), bs=availQ(b,pn), hs=availQ(h0,pn), cs=sum(CENTRALS,c=>availQ(c,pn));
    const route = bs>=q?['ok','Branch can issue the full quantity from its own stock.']:bs>0?['warn',`Branch has ${bs} of ${q}. It issues ${bs}; the balance of ${q-bs} goes to ${h0} as a linked request.`]:hs>0?['warn',`Branch has none. ${h0} holds ${hs}.`]:['bad',`Branch and ${h0} have none. Central TRCE holds ${cs}.`];
    h+=`<p class="${route[0]}-t" style="font-weight:600;margin:8px 0 12px">${esc(route[1])}</p>

/* =========================================================
   Storage and sync layer
   - Everything is stored in the browser's IndexedDB (no localStorage).
   - Online mode (SMT_CONFIG.FLOW_URL set): every record is sent to ONE
     Power Automate flow, which saves it as JSON in the "RAW PAYLOAD"
     column of the SharePoint list, and saves documents and photos in the
     SharePoint document library. Offline changes queue and sync later.
   - Demo mode (no FLOW_URL): the built-in demo data runs in IndexedDB.
   ========================================================= */
const CFG = Object.assign({FLOW_URL:'', APP_NAME:APP.name}, window.SMT_CONFIG||{});
const ONLINE = !!CFG.FLOW_URL;

/* ---------- IndexedDB ---------- */
const IDB = { db:null,
  open(){ return new Promise((res,rej)=>{ const q=indexedDB.open('prostarm_smtrce',1);
    q.onupgradeneeded=()=>{ const d=q.result; ['state','meta','files'].forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
    q.onsuccess=()=>{ IDB.db=q.result; res(); }; q.onerror=()=>rej(q.error); }); },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=IDB.db.transaction(store,mode); const s=t.objectStore(store); const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); },
  get(store,key){ return IDB.tx(store,'readonly',s=>s.get(key)); },
  put(store,key,val){ return IDB.tx(store,'readwrite',s=>s.put(val,key)); },
  del(store,key){ return IDB.tx(store,'readwrite',s=>s.delete(key)); },
  clear(store){ return IDB.tx(store,'readwrite',s=>s.clear()); }
};
const META = {}; // in-memory copy of the meta store
const metaSet = (k,v) => { META[k]=v; return IDB.put('meta',k,v).catch(()=>{}); };

/* ---------- entity map: DB collection <-> SharePoint EntityType ---------- */
const ENT = REF.sharepoint.entities;
const APPEND_ONLY = REF.sharepoint.appendOnly;
const recKey = (e,o) => e==='Stock'?skey(o.loc,o.pn,o.cat) : e==='ComponentStock'?o.loc+'|'+o.code : e==='PriceHistory'?(o.id||o.ts+'|'+o.code) : (o.id||o.pn||o.code);
function fnv(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+s.length.toString(36); }
/* strip data that must not travel in RAW PAYLOAD: password hashes go to the Secret column, file bytes go to the library */
function cleanPayload(e,o){ const c=JSON.parse(JSON.stringify(o)); let secret;
  if(e==='User'){ secret=c.pw; delete c.pw; }
  const strip=a=>(a||[]).forEach(f=>{ if(f.url&&String(f.url).startsWith('data:')){ delete f.url; f.pendingUpload=true; } });
  if(c.att) strip(c.att); if(c.images) strip(c.images);
  return {p:JSON.stringify(c),secret}; }
const configObj = () => ({models:DB.models,couriers:DB.couriers,sla:DB.sla,rolePerms:DB.rolePerms});
function* allRecords(){
  for(const [e,coll,kind] of ENT){
    if(kind==='one'){ yield [e,'main',configObj()]; continue; }
    const c=DB[coll]; if(!c) continue;
    if(kind==='arr') for(const o of c) yield [e,recKey(e,o),o];
    else for(const k in c) yield [e,k,c[k]];
  }
}

/* ---------- change detection: hash every record, queue the ones that changed ---------- */
let syncTimer=null, pushing=false;
const SYNC = { state:'idle', pending:0, last:null, error:'' };
function setSync(st,err){ SYNC.state=st; SYNC.error=err||''; SYNC.pending=(META.outbox||[]).length; const el=$('#syncChip'); if(el) el.outerHTML=syncChipHTML(); }
function syncChipHTML(){ if(!ONLINE) return `<span id="syncChip" class="rolechip" title="Demo mode: data stays in this browser (IndexedDB)">Demo, local</span>`;
  const p=(META.outbox||[]).length; const s=SYNC.state==='error'?'Sync error':!navigator.onLine?'Offline, '+p+' queued':p?'Syncing '+p:'Synced';
  return `<span id="syncChip" class="rolechip sync-${SYNC.state}${p?' busy':''}" title="${esc(SYNC.error||('SharePoint sync. Last '+(SYNC.last?fdt(SYNC.last):'never')))}" data-act="syncNow">${esc(s)}</span>`; }
function queueChanges(){
  if(!ONLINE||!META.token) return 0;
  const hashes=META.hashes||{}; const out=META.outbox||[]; const pend=new Set(out.map(o=>o.k)); let n=0;
  for(const [e,id,o] of allRecords()){ const k=e+'|'+id; const {p,secret}=cleanPayload(e,o); const h=fnv(p);
    if(hashes[k]===h) continue;
    if(APPEND_ONLY.includes(e) && hashes[k]) continue;
    hashes[k]=h; const op={k,op:APPEND_ONLY.includes(e)&&!(META.versions||{})[k]?'insert':'upsert',e,id,p,base:(META.versions||{})[k]||0,loc:o.loc||o.branch||'',status:o.status||'',secret};
    const i=out.findIndex(x=>x.k===k); if(i>=0) out[i]=op; else out.push(op); n++; }
  /* files waiting to go to the SharePoint library */
  for(const [e,coll] of [['Request','requests'],['ScrapApproval','approvals']]) for(const id in DB[coll]){ const o=DB[coll][id];
    (o.att||o.images||[]).forEach((f,ix)=>{ if(f.url&&String(f.url).startsWith('data:')&&!f.sp){ const k='FILE|'+e+'|'+id+'|'+ix; if(!pend.has(k)){ out.push({k,op:'file',e,id,ix,name:f.name,type:f.type,kind:f.kind||'',dataUrl:f.url}); n++; } } }); }
  META.hashes=hashes; META.outbox=out; IDB.put('meta','hashes',hashes); IDB.put('meta','outbox',out);
  return n;
}
async function api(action,data){
  const r=await fetch(CFG.FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:META.token||'',data:data||{}})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(r.status===401){ if(action==='login') throw new Error((j&&j.error)||'Employee ID or password is wrong.'); await metaSet('token',''); throw new Error('Session expired. Sign in again.'); }
  if(!r.ok||!j||j.ok===false) throw new Error((j&&j.error)||('Server error '+r.status));
  return j;
}
async function pushOutbox(){
  if(!ONLINE||pushing||!META.token||!navigator.onLine) return; const out=META.outbox||[]; if(!out.length){ setSync('idle'); return; }
  pushing=true; setSync('busy');
  try{
    /* 1. files first, so records can carry their SharePoint links */
    for(const f of out.filter(o=>o.op==='file').slice(0,5)){
      const rec=(f.e==='Request'?DB.requests:DB.approvals)[f.id]; const arr=rec&&(rec.att||rec.images); const att=arr&&arr[f.ix];
      if(!att){ out.splice(out.indexOf(f),1); continue; }
      const b64=f.dataUrl.split(',')[1]; if(b64.length*0.75>CFG.MAX_FILE_MB*1048576){ att.uploadError='Larger than '+CFG.MAX_FILE_MB+' MB'; out.splice(out.indexOf(f),1); continue; }
      const res=await api('uploadFile',{entity:f.e,recordId:f.id,fileName:`${f.ix+1}_${f.name}`.replace(/[\\/:*?"<>|#%]/g,'_'),contentType:f.type,kind:f.kind,uploadedBy:S.user?S.user.id:'',content:b64});
      att.sp={url:res.url,path:res.path,id:res.id}; await IDB.put('files',res.path,f.dataUrl); delete att.url; delete att.pendingUpload;
      out.splice(out.indexOf(f),1); audit('Document saved to SharePoint','Document',f.id,`${att.name} to ${res.path}`);
    }
    /* 2. records, in batches */
    const recs=out.filter(o=>o.op!=='file').slice(0,CFG.BATCH_SIZE);
    if(recs.length){ const res=await api('upsert',{items:recs.map(o=>({op:o.op,entity:o.e,recordId:o.id,baseVersion:o.base,payload:o.p,location:o.loc,status:o.status,secret:o.secret,updatedBy:S.user?S.user.id:''}))});
      const vers=META.versions||{}; const sentSet=new Set(recs); const cur=META.outbox||[];
      (res.saved||[]).forEach(s=>{ const k=s.entity+'|'+s.recordId; vers[k]=s.version; cur.forEach(o=>{ if(o.k===k&&!sentSet.has(o)) o.base=s.version; }); });
      (res.conflicts||[]).forEach(c=>{ const k=c.entity+'|'+c.recordId; for(let i=cur.length-1;i>=0;i--) if(cur[i].k===k&&!sentSet.has(cur[i])) cur.splice(i,1); applyRemote(c); toast(`${c.recordId} was changed by another user at the same time. The latest version is loaded; please check it and repeat your step if still needed.`,true); }); if((res.conflicts||[]).length){ rebuildStock(); refreshAll(); }
      const done=new Set([...(res.saved||[]),...(res.conflicts||[])].map(s=>s.entity+'|'+s.recordId));
      META.outbox=cur.filter(o=>!(sentSet.has(o)&&done.has(o.k))); META.versions=vers; await IDB.put('meta','versions',vers); }
    else META.outbox=out;
    await IDB.put('meta','outbox',META.outbox); await IDB.put('state','db',DB);
    SYNC.last=nowISO(); setSync(META.outbox.length?'busy':'idle');
  }catch(e){ setSync('error',e.message); if(/Session expired/.test(e.message)){ S.user=null; render(); } }
  finally{ pushing=false; }
  if((META.outbox||[]).length && SYNC.state!=='error') setTimeout(pushOutbox,400);
}
/* ---------- stock is never synced as a balance: it is rebuilt from the SharePoint ledger (StockTxn), so the ledger is the single truth ---------- */
function rebuildStock(){ const old=DB.stock||{}, S1={}, C1={};
  DB.txns.slice().sort((a,b)=>String(a.ts).localeCompare(String(b.ts))||String(a.id).localeCompare(String(b.id))).forEach(x=>{
    if(x.cat==='Component'){ const k=x.loc+'|'+x.pn; (C1[k]=C1[k]||{loc:x.loc,code:x.pn,qty:0}).qty+=x.qty; return; }
    const k=skey(x.loc,x.pn,x.cat); const r=S1[k]||(S1[k]={loc:x.loc,pn:x.pn,cat:x.cat,qty:0,bin:(old[k]||{}).bin||binFor(x.loc,x.pn),serials:[],lots:[]}); r.qty+=x.qty;
    if(x.qty>0) r.lots.push({b:x.batch||x.id,d:x.ts,q:x.qty}); else { let need=-x.qty; while(need>0&&r.lots.length){ const l=r.lots[0]; const t=Math.min(need,l.q); l.q-=t; need-=t; if(!l.q) r.lots.shift(); } }
    if(x.serial){ if(x.qty>0) r.serials.push(x.serial); else r.serials=r.serials.filter(z=>z!==x.serial); } });
  DB.stock=S1; DB.cstock=C1; }
/* fresh-check one record before a user acts on it, so two people cannot act on the same old version */
const KIND_ENT = {req:'Request',tk:'RepairTask',cr:'ComponentRequest',xf:'StockTransfer'};
async function freshCheck(kind,id){ if(!ONLINE||!navigator.onLine||!META.token) return true; const e=KIND_ENT[kind]; if(!e) return true;
  const k=e+'|'+id; if((META.outbox||[]).some(o=>o.k===k)) return true;
  try{ const r=await api('get',{entity:e,recordId:id}); if(r.item && r.item.version>((META.versions||{})[k]||0)){ applyRemote(r.item); await pullChanges(); return false; } }catch(err){ if(/Session expired/.test(err.message)) throw err; }
  return true; }

/* ---------- pull: items changed since the last pull ---------- */
function applyRemote(it){
  const def=ENT.find(x=>x[0]===it.entity); if(!def) return; const [e,coll,kind]=def; let o; try{ o=JSON.parse(it.payload); }catch(x){ return; }
  const k=e+'|'+it.recordId; (META.hashes=META.hashes||{})[k]=fnv(it.payload); (META.versions=META.versions||{})[k]=it.version;
  if(kind==='one'){ Object.assign(DB,{models:o.models||DB.models,couriers:o.couriers||DB.couriers,sla:o.sla||DB.sla,rolePerms:o.rolePerms||DB.rolePerms}); return; }
  if(kind==='arr'){ const a=DB[coll]; const i=a.findIndex(x=>recKey(e,x)===it.recordId); if(i>=0) a[i]=o; else a.push(o); return; }
  if(e==='User' && DB.users[it.recordId]) o.pw=DB.users[it.recordId].pw;
  DB[coll][it.recordId]=o;
}
async function pullChanges(full){
  if(!ONLINE||!META.token||!navigator.onLine) return;
  try{ setSync('busy'); queueChanges(); const since=full?'':(META.lastPull||'');
    const res=await api('load',{since}); const pend=new Set((META.outbox||[]).map(o=>o.k));
    (res.items||[]).forEach(it=>{ if(!pend.has(it.entity+'|'+it.recordId)) applyRemote(it); });
    ['txns','audit','notifs'].forEach(a=>DB[a].sort((x,y)=>String(x.ts).localeCompare(String(y.ts)))); rebuildStock();
    await metaSet('lastPull',res.serverTime||nowISO()); await IDB.put('state','db',DB); await IDB.put('meta','hashes',META.hashes); await IDB.put('meta','versions',META.versions);
    SYNC.last=nowISO(); setSync((META.outbox||[]).length?'busy':'idle');
    if((res.items||[]).length && S.user){ const u=DB.users[S.user.id]; if(u) S.user=u; refreshAll(); }
  }catch(e){ setSync('error',e.message); }
}
async function onlineLogin(id,pw){
  const res=await api('login',{employeeId:id,passwordHash:pwHash(id,pw)});
  await metaSet('token',res.token); await metaSet('node',String(res.node)); await metaSet('userId',res.user.id);
  if(!DB||!DB.ver) DB=emptyDB();
  await pullChanges(!META.lastPull);
  DB.users[res.user.id]=Object.assign(DB.users[res.user.id]||{},res.user);
  return res.user;
}
VACT.syncNow = () => { if(!ONLINE) return toast('Demo mode: there is no server to sync with.'); queueChanges(); pushOutbox().then(()=>pullChanges()); };

/* ---------- documents in the SharePoint library, shown in the app ---------- */
async function docData(att){ if(att.url) return att.url; if(!att.sp) return null; let d=await IDB.get('files',att.sp.path).catch(()=>null);
  if(!d && ONLINE){ const r=await api('getFile',{path:att.sp.path}); d=`data:${r.contentType||att.type||'application/octet-stream'};base64,${r.content}`; IDB.put('files',att.sp.path,d); } return d; }
async function hydrateFiles(root=document){
  for(const img of $$('img[data-doc]',root)){ if(img.dataset.done) continue; img.dataset.done=1; const [kind,id,ix]=img.dataset.doc.split('|'); const rec=(kind==='Request'?DB.requests:DB.approvals)[id]; const att=rec&&(rec.att||rec.images||[])[+ix];
    if(att) docData(att).then(d=>{ if(d) img.src=d; }).catch(()=>{ img.alt='Preview not available'; }); }
}
VACT.docView = async el => { const [kind,id,ix]=el.dataset.doc.split('|'); const rec=(kind==='Request'?DB.requests:DB.approvals)[id]; const att=rec&&(rec.att||rec.images||[])[+ix]; if(!att) return;
  try{ const d=await docData(att); if(!d) return toast('This document is a name-only record.',true);
    const isImg=/^data:image/.test(d);
    openModal(`<div class="modal-h"><div><h2>${esc(att.name)}</h2><p class="muted">${esc(att.kind||'')}${att.sp?', saved in SharePoint':', waiting to upload'}</p></div><div class="btns">${att.sp&&att.sp.url?`<a class="btn sm" href="${esc(att.sp.url)}" target="_blank" rel="noopener">Open in SharePoint</a>`:''}<button class="btn sm" data-act="closeModal">Close</button></div></div>
      <div class="modal-b" style="text-align:center">${isImg?`<img src="${d}" alt="${esc(att.name)}" style="max-width:100%;max-height:70vh;border-radius:8px">`:/^data:application\/pdf/.test(d)?`<iframe title="${esc(att.name)}" src="${d}" style="width:100%;height:70vh;border:0"></iframe>`:`<a class="btn pri" href="${d}" download="${esc(att.name)}">Download ${esc(att.name)}</a>`}</div>`); }
  catch(e){ toast(e.message,true); } };

/* ---------- start-up ---------- */
async function storageInit(){
  await IDB.open();

/* ---------- traceability: Request → Issue → Replacement → Faulty Return → Repair → Serviceable stock / Scrap ---------- */
function traceHTML(r){
  const fam=[r.id,...(r.children||[])]; const refs=new Set([...fam,...r.tickets,...r.shipments]);
  (r.children||[]).forEach(c=>{ const k=DB.requests[c]; if(k){ k.tickets.forEach(t=>refs.add(t)); k.shipments.forEach(s=>refs.add(s)); } });
  const tx=DB.txns.filter(x=>refs.has(x.ref)); const au=DB.audit.filter(a=>refs.has(a.ref));
  const stageOfTx = x => /Issue to engineer|Transfer out to branch|Transfer in from/.test(x.type)?'Issue':/Faulty received from engineer|handed to TRCE|received for repair|sent to central|central repair/.test(x.type)?'Faulty return':/Component consumed/.test(x.type)?'Repair':/Repaired|Scrap/.test(x.type)?'Outcome':'Issue';
  const stageOfSt = s => [ST.REQ,ST.REJ,ST.FH,ST.FC].includes(s)?'Request':[ST.BI,ST.HI,ST.CI,ST.RAB,ST.ITE].includes(s)?'Issue':s===ST.SR||s===ST.CLO?'Replacement':s===ST.FSR?'Faulty return':[ST.REP,ST.SCR].includes(s)?'Outcome':'Repair';
  const items=[];
  fam.forEach(id=>{ const q=DB.requests[id]; if(!q) return; q.history.forEach(h=>items.push({ts:h.ts,stage:h.comment?stageOfSt(q.status):stageOfSt(h.status),kind:'Status',text:`${id}: ${h.comment?'Comment':h.status}`,sub:`${uname(h.by)}${h.note?', '+h.note:''}`})); });
  tx.forEach(x=>items.push({ts:x.ts,stage:stageOfTx(x),kind:'Stock',text:`${x.id}: ${x.type}`,sub:`${x.loc}, ${x.pn} ${CAT_LABEL[x.cat]||x.cat} ${x.qty>0?'+':''}${x.qty}, balance ${x.bal}${x.batch?', batch '+x.batch:x.lots?', from lots '+x.lots:''}`}));
  [...refs].filter(i=>DB.shipments[i]).forEach(i=>{ const s=DB.shipments[i]; items.push({ts:s.created,stage:s.type==='Faulty Spare Return'?'Faulty return':'Issue',kind:'Courier',text:`${s.id}: ${s.type}`,sub:`${s.courier} ${s.docket}, ${s.leg}, ${shipState(s)}${s.delivered?' '+fdt(s.delivered):''}`}); });
  r.tickets.concat(...(r.children||[]).map(c=>(DB.requests[c]||{}).tickets||[])).forEach(tid=>{ const t=DB.tickets[tid]; if(t) t.history.forEach(h=>items.push({ts:h.ts,stage:/Repaired|Scrap approved/.test(h.action)?'Outcome':'Repair',kind:'Repair task',text:`${t.id}: ${h.action}`,sub:`${uname(h.by)}${h.note?', '+h.note:''}`})); });
  DB.fwdHist.filter(f=>f.root===rootOf(r).id).forEach(f=>items.push({ts:f.ts,stage:'Request',kind:'Forwarding',text:`${f.id}: ${f.req} forwarded to ${f.to}`,sub:`${f.qty} unit(s) from ${f.from}, ${f.reason}${f.remarks?', '+f.remarks:''}, by ${uname(f.by)}`}));
  const order=['Request','Issue','Replacement','Faulty return','Repair','Outcome'];
  const txAudited = tx.filter(x=>au.some(a=>a.detail.startsWith(x.id))).length;
  return `<div class="stack"><div class="callout"><b>Chain of custody.</b> ${tx.length} stock transactions, ${tx.length===txAudited?'every one':'only '+txAudited} with a matching audit entry. ${au.length} audit entries across ${refs.size} linked records${fam.length>1?' (including split '+fam.slice(1).join(', ')+')':''}.</div>
   ${order.map((st,i)=>{ const l=items.filter(x=>x.stage===st).sort((a,b)=>a.ts.localeCompare(b.ts)); return `<div class="panel"><div class="panel-h"><h3>${i+1}. ${st}</h3><span class="tag">${l.length} events</span></div>
     ${l.length?`<ol class="tl">${l.map(x=>`<li style="--tc:${x.kind==='Stock'?'var(--c-done)':x.kind==='Courier'?'var(--c-transit)':x.kind==='Repair task'?'var(--c-repair)':'var(--c-branch)'}"><div class="h"><b>${esc(x.text)}</b><span class="gap">${x.kind}</span></div><div class="w">${fdt(x.ts)}</div><div class="d small">${esc(x.sub)}</div></li>`).join('')}</ol>`:'<p class="muted small">Not reached yet.</p>'}</div>`; }).join('')}</div>`;
}

/* ---------- inventory heatmap: location x part group, serviceable stock against minimum ---------- */
function heatmapHTML(locs,metric){
  const groups=uniq(Object.values(DB.parts).map(p=>p.cat));
  const cell=(l,g)=>{ const ps=Object.values(DB.parts).filter(p=>p.cat===g); const have=sum(ps,p=>availQ(l,p.pn)); const min=sum(ps,p=>minFor(l,p)); const val=sum(ps,p=>availQ(l,p.pn)*p.cost); return {have,min,val,r:min?have/min:1}; };
  const col=r=>r>=1.5?'#1E9A58':r>=1?'#7BC47F':r>=.6?'#F2C14E':r>=.3?'#EE8A3C':'#D2343B';
  return `<div class="tw"><table class="heat"><thead><tr><th>Location</th>${groups.map(g=>`<th class="r">${esc(g)}</th>`).join('')}<th class="r">Value</th></tr></thead><tbody>${locs.map(l=>`<tr><td class="nw"><b>${esc(l)}</b><br><span class="muted small">${locType(l)}</span></td>${groups.map(g=>{ const c=cell(l,g); return `<td class="r hc" style="--hc:${col(c.r)}" data-act="heat" data-l="${esc(l)}" data-g="${esc(g)}" title="${esc(l)}, ${esc(g)}: ${c.have} against minimum ${c.min}, ${inr(c.val)}">${metric==='val'?inrC(c.val):c.have}</td>`; }).join('')}<td class="r"><b>${inrC(locVal(l))}</b></td></tr>`).join('')}</tbody></table></div>
   <p class="chart-note">Colour compares serviceable plus new stock with the minimum level: red below 30%, amber below 100%, green at or above minimum. Select a cell for the parts behind it.</p>`;
}

function execScope(){
  const g=S.ui.exRegion||'', b=S.ui.exBranch||'';
  let rs=reqs(), ts=tickets(); let locs=LOCS;
  if(g){ rs=rs.filter(r=>regionOf(r.branch)===g); ts=ts.filter(t=>regionOf(t.branch)===g); locs=LOCS.filter(l=>regionOf(l)===g); }
  if(b){ rs=rs.filter(r=>r.branch===b); ts=ts.filter(t=>t.branch===b); locs=[b]; }
  const M=months(+(S.ui.exPeriod||6)); const from=new Date(M[0]+'-01T00:00:00').getTime();
  return {rs,ts,locs,M,from,g,b};
}

const KPI_DEF = [
  {k:'fill',t:'Spare fill rate',u:'%',tg:60,dir:1,f:'Requests filled from the requesting branch\'s own stock ÷ all fulfilled requests'},
  {k:'turnover',t:'Inventory turnover',u:'x',tg:1,dir:1,f:'Value issued to engineers (annualised) ÷ new and serviceable inventory value'},
  {k:'invVal',t:'Inventory value',u:'₹',tg:0,dir:0,f:'New, serviceable, repair task and scrap stock at unit cost, all locations'},
  {k:'succ',t:'Repair success rate',u:'%',tg:70,dir:1,f:'Repaired ÷ (repaired + scrap), repair tasks closed in the period'},
  {k:'mrt',t:'Mean repair time',u:'h',tg:4,dir:-1,f:'Average bench hours worked per closed repair task'},

  {k:'focP',t:'FOC replacement',u:'%',tg:0,dir:0,f:'FOC replacements ÷ all requests raised in the period'},

function kpiWindow(rs,ts,a,b){
  const inW=x=>x&&new Date(x)>=a&&new Date(x)<b;
  const ful=rs.filter(r=>r.fill&&inW(issuedAt(r)||r.t[ST.RAB]));
  const cl=ts.filter(t=>inW(t.closed)&&t.outcome!=='Escalated'); const rep=cl.filter(t=>t.outcome==='Repaired'), scr=cl.filter(t=>t.outcome==='Scrap');
  const slaR=rs.filter(r=>inW(issuedAt(r))); const days=(b-a)/864e5; const raised=rs.filter(r=>inW(r.created)); const foc=raised.filter(r=>r.billing!=='Chargeable').length;
  const issVal=sum(rs.filter(r=>inW(issuedAt(r))),rval); const iv=invValue(null,['New','Repaired']); const hrsL=sum(ts.filter(t=>inW(t.closed)),workHrs);
  return { fill:pct(ful.filter(r=>r.fill==='Branch').length,ful.length), turnover: iv?Math.round(issVal*(365/days)/iv*100)/100:0, invVal:Math.round(invValue(null,CATS)),
    succ:pct(rep.length,rep.length+scr.length), mrt: cl.length?Math.round(sum(cl,workHrs)/cl.length*10)/10:0, tat: cl.length?Math.round(sum(cl,tat)/cl.length):0,
    compCost:Math.round(sum(cl,compCost)), prod: hrsL?pct(rep.length*(num(DB.sla.stdRepairHrs)||2),hrsL):0, scrapP:pct(scr.length,rep.length+scr.length),
    sla:pct(slaR.filter(r=>slaInfo(r).state==='ok').length,slaR.length), focP:pct(foc,raised.length), chgP:pct(raised.length-foc,raised.length) };
}

  audit((el.checked?'Granted ':'Revoked ')+p,'Role',r,''); save(); toast(`${r}: ${el.checked?'granted':'revoked'} ${p}`); };

/* =========================================================
   Business rules and integrity checks, run live against the data.
   Every rule here is enforced by the engine; this page proves it.
   ========================================================= */
function integrityChecks(){
  const out=[]; const add=(rule,area,n,fails)=>out.push({rule,area,n,fails});
  const st=Object.values(DB.stock), tx=DB.txns, rq=Object.values(DB.requests), tk=Object.values(DB.tickets);
  const led={}; tx.forEach(x=>{ const k=x.cat==='Component'?x.loc+'|'+x.pn+'|C':x.loc+'|'+x.pn+'|'+x.cat; led[k]=(led[k]||0)+x.qty; });
  add('Stock is never negative','Inventory',st.length,st.filter(s=>s.qty<0).map(s=>`${s.loc} ${s.pn} ${s.cat} = ${s.qty}`));
  add('Stock equals the sum of its ledger transactions','Inventory',st.length,st.filter(s=>(led[s.loc+'|'+s.pn+'|'+s.cat]||0)!==s.qty).map(s=>`${s.loc} ${s.pn} ${s.cat}: stock ${s.qty}, ledger ${led[s.loc+'|'+s.pn+'|'+s.cat]||0}`));
  add('Stock equals the sum of its FIFO batches','Inventory',st.length,st.filter(s=>sum(s.lots||[],l=>l.q)!==s.qty).map(s=>`${s.loc} ${s.pn} ${s.cat}: stock ${s.qty}, batches ${sum(s.lots||[],l=>l.q)}`));
  const cs=Object.values(DB.cstock);
  add('Component stock is never negative and equals its ledger','Components',cs.length,cs.filter(c=>c.qty<0||(led[c.loc+'|'+c.code+'|C']||0)!==c.qty).map(c=>`${c.loc} ${c.code}: stock ${c.qty}, ledger ${led[c.loc+'|'+c.code+'|C']||0}`));
  const aud=new Set(DB.audit.map(a=>a.detail.slice(0,14).split(',')[0]));
  const recent=tx.filter(x=>hrs(x.ts)<24*120);
  add('Every stock and component transaction has an audit entry','Audit',recent.length,recent.filter(x=>!aud.has(x.id)).map(x=>`${x.id} ${x.type} ${x.loc}`));
  const openT=tk.filter(t=>[TK.Q,TK.IP,TK.HOLD,TK.SD].includes(t.status)); const fk={}; openT.forEach(t=>{ const k=t.loc+'|'+t.pn; fk[k]=(fk[k]||0)+1; });
  const fst=st.filter(s=>s.cat==='Faulty'); const keys=uniq([...fst.map(s=>s.loc+'|'+s.pn),...Object.keys(fk)]);
  add('Repair task inventory holds exactly the faulty units with open repair tasks','Repair',keys.length,keys.filter(k=>{ const [l,p]=k.split('|'); return stk(l,p,'Faulty')!==(fk[k]||0); }).map(k=>{ const [l,p]=k.split('|'); return `${l} ${p}: faulty stock ${stk(l,p,'Faulty')}, open tasks ${fk[k]||0}`; }));
  const last=r=>DB.tickets[(r.tickets||[]).slice(-1)[0]];
  const tmap={[ST.ATR]:[TK.Q,TK.IP],[ST.RCC]:[TK.Q,TK.IP],[ST.HOLD]:[TK.HOLD],[ST.SPA]:[TK.SD],[ST.REP]:[TK.RP],[ST.SCR]:[TK.SC]};
  const tr=rq.filter(r=>tmap[r.status]);
  add('Request status matches its latest repair task','Repair',tr.length,tr.filter(r=>{ const t=last(r); return !t||!tmap[r.status].includes(t.status); }).map(r=>`${r.id} ${r.status}, task ${(last(r)||{}).status||'none'}`));
  const trn=rq.filter(r=>[ST.HI,ST.CI,ST.FSR,ST.SCR2].includes(r.status));
  add('Every in-transit request has an open courier shipment','Courier',trn.length,trn.filter(r=>!r.shipments.some(s=>DB.shipments[s]&&!DB.shipments[s].delivered)).map(r=>`${r.id} ${r.status}`));
  const sh=Object.values(DB.shipments).filter(s=>!s.delivered);
  add('Every open shipment belongs to a record still waiting for it','Courier',sh.length,sh.filter(s=>{ if(s.refType==='req'){ const r=DB.requests[s.ref]; return !r||![ST.HI,ST.CI,ST.FSR,ST.SCR2].includes(r.status); } if(s.refType==='cr') return (DB.creqs[s.ref]||{}).status!==CR.ISS; return (DB.transfers[s.ref]||{}).status!=='In Transit'; }).map(s=>`${s.id} ${s.ref}`));
  const roots=rq.filter(r=>!r.parent && r.kind!=='repair');
  add('Split requests add up to the quantity originally asked','Requests',roots.length,roots.filter(r=>{ const fam=rq.filter(x=>rootOf(x).id===r.id); return sum(fam,x=>x.qty)!==(r.origQty||r.qty); }).map(r=>`${r.id}: asked ${r.origQty||r.qty}, family ${sum(rq.filter(x=>rootOf(x).id===r.id),x=>x.qty)}`));
  const iss=rq.filter(r=>r.t[ST.BI]||r.t[ST.ITE]);
  add('Spares handed to engineers match their issue transactions','Requests',iss.length,iss.filter(r=>-sum(tx.filter(x=>x.ref===r.id&&x.type==='Issue to engineer'),x=>x.qty)!==r.qty).map(r=>`${r.id}: qty ${r.qty}, issued ${-sum(tx.filter(x=>x.ref===r.id&&x.type==='Issue to engineer'),x=>x.qty)}`));
  const crr=Object.values(DB.creqs).filter(c=>c.status===CR.RCV);
  add('Received component requests match their receipt transactions','Components',crr.length,crr.filter(c=>c.hub!==c.loc&&sum(tx.filter(x=>x.ref===c.id&&x.loc===c.loc&&x.qty>0&&/received from/.test(x.type)),x=>x.qty)!==c.apprQty).map(c=>`${c.id}: approved ${c.apprQty}`));
  const spa=rq.filter(r=>r.status===ST.SPA), pa=Object.values(DB.approvals).filter(a=>a.status==='Pending');
  add('Scrap approvals pending match requests awaiting scrap approval','Approvals',spa.length,[...spa.filter(r=>!pa.some(a=>a.req===r.id)).map(r=>r.id+' has no pending approval'),...pa.filter(a=>(DB.requests[a.req]||{}).status!==ST.SPA).map(a=>a.id+' request not awaiting approval')]);
  const xf=Object.values(DB.transfers);
  add('Stock transfers in transit have an open shipment; received ones are closed','Transfers',xf.length,xf.filter(x=>(x.status==='In Transit')!==!!x.shipments.some(s=>DB.shipments[s]&&!DB.shipments[s].delivered)).map(x=>x.id));
  add('Every request starts with a creation record and timestamp','Requests',rq.length,rq.filter(r=>!r.history.length||!r.t[ST.REQ]).map(r=>r.id));
  const hist=rq.filter(r=>r.history.filter(h=>!h.comment).slice(-1)[0] && r.history.filter(h=>!h.comment).slice(-1)[0].status!==r.status);
  add('Current status equals the last status in the timeline','Requests',rq.length,hist.map(r=>`${r.id}: ${r.status}`));
  const dm=dailyRows(LOCS,localISO(now()-29*864e5).slice(0,10),today()); const done30=tk.filter(t=>t.outcome==='Repaired'&&t.closed&&hrs(t.closed)<29*24);
  add('TRCE daily monitor counts every completed repair','TRCE monitor',done30.length,done30.filter(t=>!dm.some(a=>a.engineer===t.engineer&&a.date===localISO(new Date(t.closed).getTime()).slice(0,10)&&a.completed>0)).map(t=>`${t.id} by ${uname(t.engineer)} on ${fd(t.closed)}`));
  return out;
}

/* ---------- live daily monitor: counts always come from repair tasks; engineers add working hours and remarks ---------- */
function dailyRows(locs,from,to){
  const users=uniq([...Object.values(DB.tickets).map(t=>t.engineer),...Object.values(DB.activity).map(a=>a.engineer)]).map(U).filter(u=>u.id&&(locs.includes(u.loc)||locs.length===LOCS.length));
  const days=[]; for(let t=new Date(from+'T00:00:00').getTime(); t<=new Date(to+'T00:00:00').getTime(); t+=864e5) days.push(localISO(t).slice(0,10));
  const D=(x,day)=>x&&localISO(new Date(x).getTime()).slice(0,10)===day; const out=[];
  users.forEach(u=>{ const tk=Object.values(DB.tickets).filter(t=>t.engineer===u.id);
    days.forEach(day=>{ const end=new Date(day+'T23:59:59').getTime();
      const f={ assigned:tk.filter(t=>D(t.received,day)).length, completed:tk.filter(t=>t.outcome==='Repaired'&&D(t.closed,day)).length,
        scrap:tk.filter(t=>t.outcome==='Scrap'&&D(t.closed,day)).length, scrapApproved:tk.filter(t=>t.scrapReq&&DB.approvals[t.scrapReq]&&DB.approvals[t.scrapReq].status==='Approved'&&D(DB.approvals[t.scrapReq].at,day)).length,
        central:tk.filter(t=>t.outcome==='Escalated'&&D(t.closed,day)).length, hold:tk.filter(t=>(t.holds||[]).some(h=>D(h.s,day))).length,
        pending:tk.filter(t=>new Date(t.received).getTime()<=end&&(!t.closed||new Date(t.closed).getTime()>end)).length,
        comps:sum(tk,t=>t.comps.filter(c=>D(c.ts,day)).length), compCost:sum(tk,t=>sum(t.comps.filter(c=>D(c.ts,day)),c=>c.qty*c.cost)),
        bench:Math.round(sum(tk,t=>sum(t.sessions,s=>{ const a=Math.max(new Date(s.s).getTime(),new Date(day+'T00:00:00').getTime()), b=Math.min(s.e?new Date(s.e).getTime():now(),end); return b>a?(b-a)/36e5:0; }))*10)/10 };
      const log=DB.activity['AL-'+day.replace(/-/g,'')+'-'+u.id];
      const active=f.assigned||f.completed||f.scrap||f.central||f.hold||f.comps||f.bench||log;
      if(!active) return;
      const hours = log ? num(log.hours) : f.bench; const prod = hours ? Math.min(150,Math.round(f.completed*(num(DB.sla.stdRepairHrs)||2)/hours*100)) : 0;
      out.push({id:day+'|'+u.id,date:day,engineer:u.id,loc:u.loc,role:u.role,...f,hours,hoursSrc:log?'Engineer log':'Bench time',prod,remarks:log?log.remarks:'',logged:!!log});
    }); });
  return out;
}

(function(){
  var FILES=['settings','app','roles','network','workflow','lists','masters','sharepoint','blueprint','branding'], BASE='config/';

  Promise.all(FILES.map(j)).then(function(arr){
    var REF={}; FILES.forEach(function(k,i){ REF[k]=arr[i]; });
    window.SMT_REF=REF; window.SMT_CONFIG=Object.assign({},REF.settings,window.SMT_CONFIG||{}); document.title=REF.app.title;
    var demo=window.SMT_CONFIG.FLOW_URL?Promise.resolve():Promise.all([j('demo-data'),j('demo-users')]).then(function(x){ x[0].users=x[1]; window.SMT_DEMO=x[0]; });
    return demo.then(function(){ var s=document.createElement('script'); s.text=document.getElementById('smt-app').textContent; document.body.appendChild(s); });
  }).catch(fail);
})();
